name: Release Image

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: [self-hosted, linux, adk-research]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - name: Build and publish to private registry
        env:
          IMAGE_TAG: ${{ github.ref_name }}
        run: |
          docker build -t "localhost:30500/research-agents:$IMAGE_TAG" .
          docker push "localhost:30500/research-agents:$IMAGE_TAG"

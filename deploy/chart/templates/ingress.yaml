{{- if .Values.api.ingressEnabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: research-api
spec:
  rules:
    - host: {{ .Values.api.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: research-api
                port:
                  name: http
{{- end }}

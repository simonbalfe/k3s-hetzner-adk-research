apiVersion: v1
kind: ServiceAccount
metadata:
  name: codex-auth-writer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: codex-auth-writer
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["codex-auth"]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: codex-auth-writer
subjects:
  - kind: ServiceAccount
    name: codex-auth-writer
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: codex-auth-writer
  apiGroup: rbac.authorization.k8s.io

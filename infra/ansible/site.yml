---
- name: Configure private network
  hosts: all
  become: true
  tasks:
    - name: Enable private interface DHCP
      ansible.builtin.copy:
        dest: /etc/netplan/60-private.yaml
        mode: "0600"
        content: |
          network:
            version: 2
            ethernets:
              enp7s0:
                dhcp4: true
                optional: true
      register: private_network

    - name: Apply private network
      ansible.builtin.command: netplan apply
      when: private_network.changed
      changed_when: true

- name: Install k3s control plane
  hosts: control_plane
  become: true
  vars:
    k3s_token: "{{ lookup('env', 'K3S_TOKEN') }}"
  tasks:
    - name: Require cluster token
      ansible.builtin.assert:
        that: k3s_token | length >= 32

    - name: Install k3s binary
      ansible.builtin.get_url:
        url: "https://github.com/k3s-io/k3s/releases/download/{{ k3s_version }}/k3s"
        dest: /usr/local/bin/k3s
        checksum: "sha256:{{ k3s_sha256 }}"
        mode: "0755"

    - name: Create k3s configuration directory
      ansible.builtin.file:
        path: /etc/rancher/k3s
        state: directory
        mode: "0700"

    - name: Write control-plane configuration
      ansible.builtin.template:
        src: templates/server-config.yaml.j2
        dest: /etc/rancher/k3s/config.yaml
        mode: "0600"
      notify: Restart k3s

    - name: Install control-plane service
      ansible.builtin.copy:
        src: files/k3s.service
        dest: /etc/systemd/system/k3s.service
        mode: "0644"
      notify: Restart k3s

    - name: Start control plane
      ansible.builtin.systemd_service:
        name: k3s
        enabled: true
        state: started
        daemon_reload: true

    - name: Wait for Kubernetes API
      ansible.builtin.wait_for:
        host: "{{ private_ip }}"
        port: 6443
        timeout: 180

    - name: Read kubeconfig
      ansible.builtin.slurp:
        src: /etc/rancher/k3s/k3s.yaml
      register: kubeconfig

    - name: Save operator kubeconfig
      ansible.builtin.copy:
        content: "{{ kubeconfig.content | b64decode | replace('127.0.0.1', ansible_host) }}"
        dest: "{{ playbook_dir }}/../../.state/kubeconfig"
        mode: "0600"
      delegate_to: localhost
      become: false

  handlers:
    - name: Restart k3s
      ansible.builtin.systemd_service:
        name: k3s
        state: restarted
        daemon_reload: true

- name: Install fixed k3s workers
  hosts: system_workers
  become: true
  vars:
    k3s_token: "{{ lookup('env', 'K3S_TOKEN') }}"
    control_private_ip: "{{ hostvars[groups['control_plane'][0]].private_ip }}"
  tasks:
    - name: Install image build engine
      ansible.builtin.apt:
        name: docker.io
        update_cache: true
        state: present

    - name: Require cluster token
      ansible.builtin.assert:
        that: k3s_token | length >= 32

    - name: Install k3s binary
      ansible.builtin.get_url:
        url: "https://github.com/k3s-io/k3s/releases/download/{{ k3s_version }}/k3s"
        dest: /usr/local/bin/k3s
        checksum: "sha256:{{ k3s_sha256 }}"
        mode: "0755"

    - name: Create k3s configuration directory
      ansible.builtin.file:
        path: /etc/rancher/k3s
        state: directory
        mode: "0700"

    - name: Write worker configuration
      ansible.builtin.template:
        src: templates/agent-config.yaml.j2
        dest: /etc/rancher/k3s/config.yaml
        mode: "0600"
      notify: Restart k3s agent

    - name: Install worker service
      ansible.builtin.copy:
        dest: /etc/rancher/k3s/registries.yaml
        mode: "0600"
        content: |
          mirrors:
            "{{ private_ip }}:30500":
              endpoint:
                - "http://{{ private_ip }}:30500"
      notify: Restart k3s agent

    - name: Install worker systemd service
      ansible.builtin.copy:
        src: files/k3s-agent.service
        dest: /etc/systemd/system/k3s-agent.service
        mode: "0644"
      notify: Restart k3s agent

    - name: Start worker
      ansible.builtin.systemd_service:
        name: k3s-agent
        enabled: true
        state: started
        daemon_reload: true

  handlers:
    - name: Restart k3s agent
      ansible.builtin.systemd_service:
        name: k3s-agent
        state: restarted
        daemon_reload: true
